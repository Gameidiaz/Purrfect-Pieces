<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="globals.js"></script>
        <title>Purrfect Pieces</title>
    </head>
    <body style="background-image: url('images/shop-bg.gif'); background-repeat: repeat; background-size: 100px; background-color: #ffb9cb;">
        <div class="ui-container">
            <h1 class="logo">Sir Meowington's Shoppe</h1>
            <img id="shopkeeper" src="images/shopkeeper.png" alt="Sir Meowington" onclick="pokeShopkeeper()">
            <input type="text" id="promoInput" placeholder="enter promo code..." maxlength="32" oninput="this.value = this.value.toUpperCase()">
            <button onclick="redeemCode()">Redeem</button>
            <p id="promoMsg" class="logo" style="font-size: clamp(14px, 2vw, 22px); min-height: 1.5em; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 6px;"></p>
            <button onclick="window.location.href='index.html'">go back</button>
        </div>
        <script>
            setTimeout(() => {
                const msg = document.getElementById('promoMsg');
                const lines = [
                    "...oh? you're hewe. good timing.",
                    "bawksawot's emporium? cwosed. FOWEVEW. uwu",
                    "mwe shouldn't be mean but... im gwad hes gone. hehe",
                    "no more BOWK BOWK BOWK aww day wong. peace at wast.",
                    "...this is MY shoppe now. was awways my shoppe. but stiww. :3",
                ];
                let i = 0;
                const interval = setInterval(() => {
                    msg.textContent = lines[i];
                    i++;
                    if (i >= lines.length) {
                        clearInterval(interval);
                        setTimeout(() => msg.textContent = '', 2000);
                    }
                }, 2200);
            }, 500);

            let pokeCount = 0;
            const pokeMessages = [
                "h-hey!! stawp poking mwe!! >w<",
                "im getting angwy >:3",
                "STAWP IT WIGHT NOW OW I WILL SCWEEM >:(",
                "YOU HAVE BEEN WAWNED!! SIW MEOWINGTON IS VEWY ANGWY!! >:O",
                "THATS IT!! IM CALLING THE PAWLICE!! >:(((",
                "YOU THINK THIS IS FUNNY?? IM TWEMBLING WITH WAGE RN >:(((((",
                "IM SO MAD I CANT EVEN UWUUUUU AAAAAAAA >:OOOOO",
                "...fine. do what you want. i dont cawe anymore. 😾",
            ];

            function pokeShopkeeper() {
                pokeCount++;
                if (pokeCount % 5 === 0) {
                    const stage = Math.min((pokeCount / 5) - 1, pokeMessages.length - 1);
                    document.getElementById('promoMsg').textContent = pokeMessages[stage];
                }
            }

            const codes = {
                "NYAN": {
                    msg: "nyan cat puzzle unlocked :3",
                    action: () => {
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: 'images/nyan.png', name: "Nyan Cat" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
                "MEOWINGTON": {
                    msg: "loading sir meowington as a puzzle... :3",
                    action: () => {
                        const imgSrc = document.getElementById('shopkeeper').src;
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: imgSrc, name: "Sir Meowington" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
                "MAVVI": {
                    msg: "loading mavvi as a puzzle... :3",
                    action: () => {
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: 'images/Mavvi.png', name: "Mavvi" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
                "TOONCES": {
                    msg: "loading toonces as a puzzle... :3",
                    action: () => {
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: 'images/toonces.png', name: "Toonces" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
                "HOWIE": {
                    msg: "loading howie as a puzzle... :3",
                    action: () => {
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: 'images/howie.png', name: "Howie" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
                "CUBE 463": {
                    msg: "loading cube 463 as a puzzle... :3",
                    action: () => {
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: 'images/cube_463.png', name: "Cube 463" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
                "CUBE 98": {
                    msg: "loading cube 98 as a puzzle... :3",
                    action: () => {
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: 'images/cube_98.png', name: "Cube 98" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
                "CUBE 339": {
                    msg: "loading cube 339 as a puzzle... :3",
                    action: () => {
                        localStorage.setItem('activePuzzle', JSON.stringify({ img: 'images/cube_339.png', name: "Cube 339" }));
                        setTimeout(() => window.location.href = 'puzzle.html?custom=1', 800);
                    }
                },
            };

            function redeemCode() {
                const input = document.getElementById('promoInput').value.trim().toUpperCase();
                const msg = document.getElementById('promoMsg');

                if (!input) {
                    msg.textContent = "psst... type a code first";
                    return;
                }

                if (codes[input]) {
                    msg.textContent = "✓ " + codes[input].msg;
                    if (codes[input].action) codes[input].action();
                } else {
                    msg.textContent = "Sir Meowington does not recognize that code.";
                }
            }
        </script>
        <audio id="shoppeMusic" src="audio/shoppe.mp3" loop></audio>
        <p id="musicHint" style="position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:13px;opacity:0.5;pointer-events:none;margin:0;">♪ click anywhere to start music</p>
        <script>
            const music = document.getElementById('shoppeMusic');
            const hint = document.getElementById('musicHint');
            music.volume = (localStorage.getItem('musicVolume') ?? 50) / 100;
            music.play().catch(() => {
                hint.style.display = 'block';
                document.addEventListener('click', () => {
                    music.play();
                    hint.style.display = 'none';
                }, { once: true });
            });
        </script>
    </body>
</html>
