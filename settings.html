<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="globals.js"></script>
        <title>Purrfect Pieces</title>
    </head>
    <body>
        <div class="ui-container">
            <h1 class="logo">Settings</h1>

            <section class="settings-section">
                <h2>Style</h2>
                <label class="setting-row">Background Image
                    <input type="file" id="bgImageFile" accept="image/*">
                </label>
                <label class="setting-row">Font
                    <select id="fontPicker"></select>
                </label>
                <label class="setting-row">
                    <span>Corner Roundness <span class="setting-value" id="radiusLabel">20px</span></span>
                    <input type="range" id="radiusSlider" min="0" max="40">
                </label>
            </section>

            <section class="settings-section">
                <h2>Audio</h2>
                <label class="setting-row">
                    <span>Music Volume <span class="setting-value" id="musicLabel">50%</span></span>
                    <input type="range" id="musicVolume" min="0" max="100">
                </label>
                <label class="setting-row">
                    <span>SFX Volume <span class="setting-value" id="sfxLabel">100%</span></span>
                    <input type="range" id="sfxVolume" min="0" max="100">
                </label>
            </section>

            <div class="settings-actions">
                <button onclick="window.location.href='index.html'">Menu</button>
                <button onclick="resetSettings()">Reset</button>
            </div>
        </div>
        <script>
            // Style
            const bgImageFile = document.getElementById('bgImageFile');

            bgImageFile.addEventListener('change', () => {
                const file = bgImageFile.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    localStorage.setItem('bgImage', `url("${e.target.result}")`);
                    applySettings();
                };
                reader.readAsDataURL(file);
            });

            const fontPicker = document.getElementById('fontPicker');
            availableFonts.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                opt.style.fontFamily = f;
                fontPicker.appendChild(opt);
            });

            function setFont(font) {
                fontPicker.value = font;
                fontPicker.style.fontFamily = font;
            }
            setFont(localStorage.getItem('font') || defaults.font);

            fontPicker.addEventListener('change', () => {
                localStorage.setItem('font', fontPicker.value);
                setFont(fontPicker.value);
                applySettings();
            });

            // Sliders: [storage key, slider id, label id, unit, default, applies to page style]
            const sliders = [
                ['radius', 'radiusSlider', 'radiusLabel', 'px', defaults.radius, true],
                ['musicVolume', 'musicVolume', 'musicLabel', '%', defaults.musicVolume, false],
                ['sfxVolume', 'sfxVolume', 'sfxLabel', '%', defaults.sfxVolume, false],
            ].map(([key, sliderId, labelId, unit, fallback, restyle]) => {
                const slider = document.getElementById(sliderId);
                const label = document.getElementById(labelId);
                const set = (value) => {
                    slider.value = value;
                    label.textContent = `${value}${unit}`;
                };
                set(localStorage.getItem(key) ?? fallback);
                slider.addEventListener('input', () => {
                    localStorage.setItem(key, slider.value);
                    set(slider.value);
                    if (restyle) applySettings();
                });
                return { key, reset: () => set(fallback) };
            });

            function resetSettings() {
                ['bgImage', 'font'].forEach(k => localStorage.removeItem(k));
                sliders.forEach(s => {
                    localStorage.removeItem(s.key);
                    s.reset();
                });
                bgImageFile.value = '';
                setFont(defaults.font);
                applySettings();
            }
        </script>
    </body>
</html>
