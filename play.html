        <div class="ui-container">
            <h1 class="logo" id="levelCount">Puzzle Levels</h1>

            <div class="settings-actions">
                <button onclick="window.location.href='index.html'">Menu</button>
                <button onclick="window.location.href='custom.html'">Custom</button>
            </div>

            <section class="settings-section puzzle-panel">
                <div class="puzzle-container">
                </div>
            </section>
        </div>
        <script src="play.js"></script>
        <audio id="puzzleMusic" src="audio/puzzled.mp3" loop></audio>
        <p id="musicHint" style="position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:13px;opacity:0.5;pointer-events:none;margin:0;">♪ click anywhere to start music</p>
        <script>
            const music = document.getElementById('puzzleMusic');
            const hint = document.getElementById('musicHint');
            music.volume = (localStorage.getItem('musicVolume') ?? 50) / 100;
            music.play().catch(() => {
                hint.style.display = 'block';
                document.addEventListener('click', () => {
                    music.play();
                    hint.style.display = 'none';
                }, { once: true });
            });
        </script>
    </body>
</html>
