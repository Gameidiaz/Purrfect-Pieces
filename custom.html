<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="globals.js"></script>
        <title>Purrfect Pieces</title>
    </head>
    <body>
        <div class="ui-container">
            <h1 class="logo">Custom Puzzles</h1>

            <div class="settings-actions">
                <button onclick="window.location.href='play.html'">Back</button>
            </div>

            <section class="settings-section">
                <h2>Add a Puzzle</h2>
                <label class="setting-row">Upload Image
                    <input type="file" id="uploadImage" accept="image/*">
                </label>
                <div class="settings-actions">
                    <button onclick="openDrawPanel()">Draw a Puzzle</button>
                    <button onclick="clearUploads()">Clear Uploads</button>
                </div>
            </section>

            <section class="settings-section puzzle-panel">
                <div class="puzzle-container" id="customContainer"></div>
            </section>
        </div>
        <div id="drawPanel" style="display:none; position:fixed; inset:0; z-index:200; background:color-mix(in srgb, var(--primary-color) 70%, transparent); align-items:center; justify-content:center; padding:14px; overflow:auto;">
            <section class="settings-section puzzle-panel">
                <h2>Draw a Puzzle</h2>
                <div id="canvasWrap" style="position:relative; display:inline-block; align-self:center;">
                    <canvas id="drawCanvas" width="450" height="450" style="display:block; background:#fff; border:4px solid var(--primary-color); border-radius:var(--radius-sm); touch-action:none; max-width:90vw; max-height:60vh; box-shadow:0 6px 16px color-mix(in srgb, var(--primary-color) 35%, transparent);"></canvas>
                    <canvas id="previewCanvas" width="450" height="450" style="position:absolute; top:0; left:0; width:100%; height:100%; box-sizing:border-box; border:4px solid transparent; border-radius:var(--radius-sm); pointer-events:none;"></canvas>
                </div>
                <div class="settings-actions">
                    <label class="setting-row" style="flex:1 1 160px;">Width
                        <input type="number" id="canvasWidthInput" min="100" max="1200" step="10" value="450">
                    </label>
                    <label class="setting-row" style="flex:1 1 160px;">Height
                        <input type="number" id="canvasHeightInput" min="100" max="1200" step="10" value="450">
                    </label>
                </div>
                <label class="setting-row">
                    Brush Color
                    <input type="color" id="brushColor" value="#352130">
                </label>
                <label class="setting-row">
                    Brush Size
                    <input type="range" id="brushSize" min="1" max="40" value="6">
                </label>
                <div class="settings-actions">
                    <button id="brushToolBtn" onclick="setTool('brush')">🖌 Brush</button>
                    <button id="fillToolBtn" onclick="setTool('fill')">🪣 Fill</button>
                    <button id="rectToolBtn" onclick="setTool('rect')">▭ Rect</button>
                    <button id="circleToolBtn" onclick="setTool('circle')">◯ Circle</button>
                    <button onclick="clearCanvas()">Clear</button>
                </div>
                <div class="settings-actions">
                    <button onclick="closeDrawPanel()">Cancel</button>
                    <button onclick="saveDrawing()">Save Puzzle</button>
                </div>
            </section>
        </div>
        <script>
            const container = document.getElementById('customContainer');

            // Migrate old format (plain dataUrl strings) to {img, name} objects
            let customImages = JSON.parse(localStorage.getItem('customImages') || '[]');
            customImages = customImages.map((entry, i) =>
                typeof entry === 'string' ? { img: entry, name: `Custom ${i + 1}` } : entry
            );
            localStorage.setItem('customImages', JSON.stringify(customImages));

            customImages.forEach((entry, index) => addCustomButton(entry, index));

            document.getElementById('uploadImage').addEventListener('change', () => {
                const file = document.getElementById('uploadImage').files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const rawName = prompt('Name this puzzle:', file.name.replace(/\.[^.]+$/, '')) ?? '';
                    const name = rawName.trim() || `Custom ${customImages.length + 1}`;
                    const entry = { img: e.target.result, name };
                    customImages.push(entry);
                    localStorage.setItem('customImages', JSON.stringify(customImages));
                    addCustomButton(entry, customImages.length - 1);
                    document.getElementById('uploadImage').value = '';
                };
                reader.readAsDataURL(file);
            });

            function clearUploads() {
                localStorage.removeItem('customImages');
                location.reload();
            }

            const drawPanel = document.getElementById('drawPanel');
            const drawCanvas = document.getElementById('drawCanvas');
            const drawCtx = drawCanvas.getContext('2d');
            const previewCanvas = document.getElementById('previewCanvas');
            const previewCtx = previewCanvas.getContext('2d');
            const brushColor = document.getElementById('brushColor');
            const brushSize = document.getElementById('brushSize');
            const canvasWidthInput = document.getElementById('canvasWidthInput');
            const canvasHeightInput = document.getElementById('canvasHeightInput');
            const brushToolBtn = document.getElementById('brushToolBtn');
            const fillToolBtn = document.getElementById('fillToolBtn');
            const rectToolBtn = document.getElementById('rectToolBtn');
            const circleToolBtn = document.getElementById('circleToolBtn');
            let drawing = false;
            let lastX = 0;
            let lastY = 0;
            let tool = 'brush';
            let shapeStart = null;

            function syncPreviewSize() {
                previewCanvas.width = drawCanvas.width;
                previewCanvas.height = drawCanvas.height;
            }
            syncPreviewSize();

            function setTool(t) {
                tool = t;
                const buttons = { brush: brushToolBtn, fill: fillToolBtn, rect: rectToolBtn, circle: circleToolBtn };
                Object.entries(buttons).forEach(([name, btn]) => {
                    btn.style.outline = name === t ? '3px solid var(--primary-color)' : 'none';
                });
            }
            setTool('brush');

            function hexToRgb(hex) {
                const num = parseInt(hex.replace('#', ''), 16);
                return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
            }

            function floodFill(x, y, hexColor) {
                x = Math.floor(x);
                y = Math.floor(y);
                const w = drawCanvas.width;
                const h = drawCanvas.height;
                if (x < 0 || y < 0 || x >= w || y >= h) return;

                const imageData = drawCtx.getImageData(0, 0, w, h);
                const data = imageData.data;
                const startIdx = (y * w + x) * 4;
                const startR = data[startIdx];
                const startG = data[startIdx + 1];
                const startB = data[startIdx + 2];
                const startA = data[startIdx + 3];
                const [fr, fg, fb] = hexToRgb(hexColor);
                const fa = 255;
                if (startR === fr && startG === fg && startB === fb && startA === fa) return;

                const tolerance = 32;
                function matches(idx) {
                    return Math.abs(data[idx] - startR) <= tolerance &&
                        Math.abs(data[idx + 1] - startG) <= tolerance &&
                        Math.abs(data[idx + 2] - startB) <= tolerance &&
                        Math.abs(data[idx + 3] - startA) <= tolerance;
                }

                const stack = [[x, y]];
                while (stack.length) {
                    const [cx, cy] = stack.pop();
                    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
                    const idx = (cy * w + cx) * 4;
                    if (!matches(idx)) continue;
                    data[idx] = fr;
                    data[idx + 1] = fg;
                    data[idx + 2] = fb;
                    data[idx + 3] = fa;
                    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
                }

                drawCtx.putImageData(imageData, 0, 0);
            }

            function clearCanvas() {
                drawCtx.fillStyle = '#fff';
                drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
            }

            function resizeCanvas() {
                const newW = Math.max(50, Math.min(1200, parseInt(canvasWidthInput.value) || drawCanvas.width));
                const newH = Math.max(50, Math.min(1200, parseInt(canvasHeightInput.value) || drawCanvas.height));
                if (newW === drawCanvas.width && newH === drawCanvas.height) return;

                const prevImage = drawCanvas.toDataURL('image/png');
                const prevW = drawCanvas.width;
                const prevH = drawCanvas.height;
                const img = new Image();
                img.onload = () => {
                    drawCanvas.width = newW;
                    drawCanvas.height = newH;
                    drawCtx.fillStyle = '#fff';
                    drawCtx.fillRect(0, 0, newW, newH);
                    drawCtx.drawImage(img, 0, 0, prevW, prevH, 0, 0, newW, newH);
                    syncPreviewSize();
                };
                img.src = prevImage;
            }

            canvasWidthInput.addEventListener('change', resizeCanvas);
            canvasHeightInput.addEventListener('change', resizeCanvas);

            function openDrawPanel() {
                canvasWidthInput.value = drawCanvas.width;
                canvasHeightInput.value = drawCanvas.height;
                clearCanvas();
                syncPreviewSize();
                setTool('brush');
                drawPanel.style.display = 'flex';
            }

            function closeDrawPanel() {
                drawPanel.style.display = 'none';
            }

            if (new URLSearchParams(window.location.search).get('draw') === '1') {
                openDrawPanel();
                history.replaceState({}, '', 'custom.html');
            }

            function canvasPos(e) {
                const rect = drawCanvas.getBoundingClientRect();
                let point = e;
                if (e.touches && e.touches.length) point = e.touches[0];
                else if (e.changedTouches && e.changedTouches.length) point = e.changedTouches[0];
                return {
                    x: (point.clientX - rect.left) * (drawCanvas.width / rect.width),
                    y: (point.clientY - rect.top) * (drawCanvas.height / rect.height),
                };
            }

            function drawShape(ctx, start, end) {
                ctx.strokeStyle = brushColor.value;
                ctx.lineWidth = brushSize.value;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                if (tool === 'rect') {
                    const x = Math.min(start.x, end.x);
                    const y = Math.min(start.y, end.y);
                    ctx.strokeRect(x, y, Math.abs(end.x - start.x), Math.abs(end.y - start.y));
                } else if (tool === 'circle') {
                    const cx = (start.x + end.x) / 2;
                    const cy = (start.y + end.y) / 2;
                    const rx = Math.abs(end.x - start.x) / 2;
                    const ry = Math.abs(end.y - start.y) / 2;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            function startDraw(e) {
                e.preventDefault();
                const pos = canvasPos(e);

                if (tool === 'fill') {
                    floodFill(pos.x, pos.y, brushColor.value);
                    return;
                }

                if (tool === 'rect' || tool === 'circle') {
                    drawing = true;
                    shapeStart = pos;
                    return;
                }

                drawing = true;
                lastX = pos.x;
                lastY = pos.y;
                drawCtx.beginPath();
                drawCtx.arc(pos.x, pos.y, brushSize.value / 2, 0, Math.PI * 2);
                drawCtx.fillStyle = brushColor.value;
                drawCtx.fill();
            }

            function moveDraw(e) {
                if (!drawing) return;
                e.preventDefault();
                const pos = canvasPos(e);

                if (tool === 'rect' || tool === 'circle') {
                    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                    drawShape(previewCtx, shapeStart, pos);
                    return;
                }

                drawCtx.strokeStyle = brushColor.value;
                drawCtx.lineWidth = brushSize.value;
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                drawCtx.beginPath();
                drawCtx.moveTo(lastX, lastY);
                drawCtx.lineTo(pos.x, pos.y);
                drawCtx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            }

            function endDraw(e) {
                if (drawing && (tool === 'rect' || tool === 'circle') && shapeStart) {
                    drawShape(drawCtx, shapeStart, canvasPos(e));
                    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                    shapeStart = null;
                }
                drawing = false;
            }

            drawCanvas.addEventListener('mousedown', startDraw);
            drawCanvas.addEventListener('mousemove', moveDraw);
            drawCanvas.addEventListener('mouseup', endDraw);
            drawCanvas.addEventListener('mouseleave', endDraw);
            drawCanvas.addEventListener('touchstart', startDraw);
            drawCanvas.addEventListener('touchmove', moveDraw);
            drawCanvas.addEventListener('touchend', endDraw);

            function saveDrawing() {
                const rawName = prompt('Name this puzzle:', '') ?? '';
                const name = rawName.trim() || `Custom ${customImages.length + 1}`;
                const entry = { img: drawCanvas.toDataURL('image/png'), name };
                customImages.push(entry);
                localStorage.setItem('customImages', JSON.stringify(customImages));
                addCustomButton(entry, customImages.length - 1);
                closeDrawPanel();
            }

            function addCustomButton(entry, index) {
                const wrap = document.createElement('div');
                wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px;';

                const btn = document.createElement('button');
                const img = document.createElement('img');
                img.src = entry.img;
                img.alt = entry.name;
                btn.appendChild(img);
                btn.addEventListener('click', () => {
                    localStorage.setItem('activePuzzle', JSON.stringify(entry));
                    window.location.href = 'puzzle.html?custom=1';
                });

                const label = document.createElement('span');
                label.textContent = entry.name;
                label.style.cssText = `
                    font-family: var(--font); font-size: clamp(10px, 1.5vw, 14px);
                    color: var(--primary-color); text-align: center;
                    max-width: clamp(44px, 8vw, 60px); overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap;
                `;

                wrap.appendChild(btn);
                wrap.appendChild(label);
                container.appendChild(wrap);
            }
        </script>
    </body>
</html>
